name: Bitget Scanner

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  overheat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python overheat.py
        env:
          OVERHEAT_SHEET_ID: ${{ secrets.OVERHEAT_SHEET_ID }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
    confirm:
    needs: overheat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python confirm.py
        env:
          OVERHEAT_SHEET_ID: ${{ secrets.OVERHEAT_SHEET_ID }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
